<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Soko Garden</title>
    <link href="../static/files/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 32px rgba(0,0,0,0.10);
            padding: 40px 36px;
            max-width: 380px;
            width: 100%;
        }
        .login-card h2 {
            font-weight: 800;
            color: #6a0dad;
            text-align: center;
            margin-bottom: 4px;
        }
        .login-card p.subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }
        .form-label { font-weight: 600; font-size: 0.85rem; color: #444; }
        .form-control {
            border-radius: 8px;
            border: 1.5px solid #ddd;
            padding: 10px 14px;
            margin-bottom: 16px;
        }
        .form-control:focus {
            border-color: #6a0dad;
            box-shadow: 0 0 0 3px rgba(106,13,173,0.10);
        }
        .btn-login {
            background: #6a0dad;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 700;
            width: 100%;
        }
        .btn-login:hover { background: #530a9e; color: #fff; }
        .alert-error {
            background: #fdeaea;
            color: #c0392b;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.88rem;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔐 Admin Login</h2>
        <p class="subtitle">Sign in to manage orders</p>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/admin/login">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required>

            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>

            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
